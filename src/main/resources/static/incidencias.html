<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidencias · Semáforo+ (TECSUP)</title>
<meta name="description" content="Semáforo+: Registro de incidencias y eventos en nodo único INT-01 (TECSUP · ODS 11).">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>try{var p=JSON.parse(localStorage.getItem('vs_prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;if(p.density)document.documentElement.dataset.density=p.density}catch(e){}</script>
</head>
<body data-page="incidencias" data-title="Incidencias y Eventos" data-subtitle="Registro de eventos del microcontrolador ESP32 y sensores en INT-01">
<a class="skip-link" href="#content">Saltar al contenido</a>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Navegación lateral"></aside>
<div class="scrim" id="scrim"></div>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content" id="content" tabindex="-1">
<section class="kpis four" id="icKpis" aria-label="Resumen de incidencias"></section>
<div class="toolbar no-print">
  <div class="field grow"><label for="q">Buscar</label><div class="search"><i data-lucide="search"></i><input id="q" type="search" placeholder="Código, descripción o intersección" autocomplete="off"></div></div>
  <div class="field"><label for="fType">Tipo</label><select id="fType"></select></div>
  <div class="field"><label for="fPrio">Prioridad</label><select id="fPrio"></select></div>
  <div class="field"><label for="fStt">Estado</label><select id="fStt"></select></div>
  <div class="field"><label for="fInt">Intersección</label><select id="fInt"></select></div>
  <button class="btn btn-primary" id="newBtn" type="button"><i data-lucide="plus"></i>Registrar incidencia</button>
</div>
<div class="grid">
  <article class="card span-8"><p class="muted count" id="count" aria-live="polite"></p><div class="table-wrap"><table id="icTbl"><caption class="sr-only">Tabla de incidencias</caption><thead><tr><th>Código</th><th>Tipo</th><th>Descripción</th><th>Intersección</th><th>Fecha y hora</th><th>Prioridad</th><th>Estado</th></tr></thead><tbody></tbody></table></div></article>
  <aside class="card span-4 sticky" id="icDetail" aria-live="polite" aria-label="Detalle de la incidencia"></aside>
</div>
</main>
</div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/incidencias.js"></script>
</body>
</html>
