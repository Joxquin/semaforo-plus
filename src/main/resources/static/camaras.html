<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámaras · VIA SMART</title>
<meta name="description" content="VIA SMART: prototipo visual de supervisión inteligente del tráfico urbano (datos ficticios).">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>try{var p=JSON.parse(localStorage.getItem('vs_prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;if(p.density)document.documentElement.dataset.density=p.density}catch(e){}</script>
</head>
<body data-page="camaras" data-title="Cámaras" data-subtitle="Centro de monitoreo visual simulado">
<a class="skip-link" href="#content">Saltar al contenido</a>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Navegación lateral"></aside>
<div class="scrim" id="scrim"></div>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content" id="content" tabindex="-1">
<div class="sim-banner"><i data-lucide="info"></i><span>Las vistas son ilustraciones generadas por la aplicación. No hay cámaras reales ni transmisiones conectadas.</span></div>
<div class="toolbar no-print">
  <div class="field grow"><label for="q">Buscar cámara</label><div class="search"><i data-lucide="search"></i><input id="q" type="search" placeholder="Código, nombre o vía" autocomplete="off"></div></div>
  <div class="field"><label for="fStt">Estado</label><select id="fStt"></select></div>
  <div class="field"><label for="fZone">Ubicación</label><select id="fZone"></select></div>
</div>
<div class="summary" id="camSummary"></div>
<p class="muted" id="camCount" aria-live="polite"></p>
<div class="cam-grid" id="camGrid"></div>
</main>
</div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/camaras.js"></script>
</body>
</html>
