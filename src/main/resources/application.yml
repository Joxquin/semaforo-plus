spring:
  application:
    name: semaforoplus
  datasource:
    url: jdbc:h2:mem:semaforoplus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    root: INFO
    edu.tecsup.semaforoplus: DEBUG
    org.springframework.security: INFO
