<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes · Semáforo+ (TECSUP)</title>
<meta name="description" content="Semáforo+: Sistema adaptativo de innovación y movilidad urbana (TECSUP Arequipa · ODS 11 · ESP32).">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>try{var p=JSON.parse(localStorage.getItem('vs_prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;if(p.density)document.documentElement.dataset.density=p.density}catch(e){}</script>
</head>
<body data-page="reportes" data-title="Reportes" data-subtitle="Resúmenes e informes imprimibles">
<a class="skip-link" href="#content">Saltar al contenido</a>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Navegación lateral"></aside>
<div class="scrim" id="scrim"></div>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content" id="content" tabindex="-1">
<div class="toolbar no-print">
  <div class="field"><label for="rPeriod">Periodo</label><select id="rPeriod"></select></div>
  <div class="field" id="rFromBox" hidden><label for="rFrom">Desde</label><input type="date" id="rFrom"></div>
  <div class="field" id="rToBox" hidden><label for="rTo">Hasta</label><input type="date" id="rTo"></div>
  <button class="btn" id="rGen" type="button"><i data-lucide="refresh-cw"></i>Generar reporte</button>
  <div class="toolbar-spacer"></div>
  <button class="btn btn-primary" id="rPrint" type="button"><i data-lucide="printer"></i>Imprimir / Guardar PDF</button>
</div>
<p class="field-error" id="rErr" role="alert"></p>
<div class="report-dark">
  <section class="kpis four" id="rKpis" aria-label="Resumen del periodo"></section>
  <div class="grid">
    <article class="card span-7"><div class="card-head"><div><h2>Flujo vehicular</h2><p id="rFlowSub"></p></div></div><div class="chart-box sm"><canvas id="rFlow" role="img" aria-label="Flujo vehicular"></canvas></div></article>
    <article class="card span-5"><div class="card-head"><div><h2>Evolución de la congestión</h2><p>Porcentaje medio por hora</p></div></div><div class="chart-box sm"><canvas id="rCong" role="img" aria-label="Evolución de la congestión"></canvas></div></article>
  </div>
</div>
<h2 class="section-title no-print">Vista previa del informe</h2>
<article class="sheet" id="sheet" aria-label="Vista previa del informe"></article>
</main>
</div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
